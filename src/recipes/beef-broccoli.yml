title: Beef Broccoli
summary:
  tl: Malambot na baka, broccoli at mushroom sa sarsang oyster sauce.
  en: Tender beef, broccoli and mushrooms in oyster sauce.
category: ulam
image: photos/beef-broccoli.png
tags: [beef, broccoli, mushroom, oyster sauce, ginisa]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1/2
        unit: { tl: kilo, en: kg }
        item: { tl: karne ng baka, en: beef }
      - amount: 1
        item: { tl: sibuyas, en: onion }
      - amount: 5
        unit: { tl: butil, en: clove }
        item: { tl: bawang, en: garlic }
      - amount: 1
        unit: small can
        item: { tl: whole mushroom, en: whole mushrooms }
      - amount: 2
        unit: cup
        item: broccoli
        note: { tl: kasama ang stalks, en: florets and stalks }
      - amount: 2
        unit: tbsp
        item: oyster sauce
      - amount: 2
        unit: tbsp
        item: cornstarch
        note: { tl: tinunaw sa konting tubig, en: dissolved in a little water }
      - item: { tl: paminta at asin, en: salt and pepper }

review:
  - The summary and the English translation were written during conversion, not by Marissa.
  - No servings, prep time or cook time in the original.

steps:
  - steps:
      - tl: Palambutin ang baka.
        en: Simmer the beef until tender.
      - tl: Kapag malambot na, alisin ang baka at itabi ang pinagkuluan.
        en: Once tender, take out the beef and set the broth aside.
      - tl: >-
          Igisa ang sibuyas, bawang, baka, broccoli stalks at mushroom. Ilagay ang sabaw, pakuluin
          at takpan.
        en: >-
          Sauté the onion, garlic, beef, broccoli stalks and mushrooms. Add the broth, bring to a
          boil and cover.
      - tl: Isunod ang broccoli florets.
        en: Add the broccoli florets.
      - tl: Ilagay ang oyster sauce at tinunaw na cornstarch. Lagyan ng konting paminta at asin.
        en: Add the oyster sauce and dissolved cornstarch. Season with a little salt and pepper.
      - tl: Timplahan pa kung nais, ayon sa inyong panlasa, at pakuluin.
        en: Adjust the seasoning to taste and bring to a boil.
