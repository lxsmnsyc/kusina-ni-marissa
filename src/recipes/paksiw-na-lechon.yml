review:
  - No photo was sent with this recipe.
  - 4 ulo ng bawang (4 heads of garlic) is a lot. It may mean 4 butil (cloves).
  - ½ tasa (½ cup) of dried oregano is a lot. It may mean ½ kutsara (tablespoon).
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: Ilagay sa kawali ang hiniwang lechon kasama ang lahat ng sangkap. Pakuluan.
        en: Put the sliced lechon and all the other ingredients in a pan. Bring to a boil.
      - tl: Hinaan ang apoy hanggang lumambot ang lechon at lumapot ang sarsa.
        en: Lower the heat and simmer until the pork is tender and the sauce has thickened.
