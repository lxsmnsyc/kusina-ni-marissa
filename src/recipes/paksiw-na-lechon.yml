title: Paksiw na Lechon
summary:
  tl: Natirang lechon na niluto sa suka, liver spread at asukal hanggang lumapot ang sarsa.
  en: Leftover roast pork simmered in vinegar, liver spread and brown sugar until the sauce thickens.
category: ulam
tags: [pork, lechon, vinegar]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1
        unit: { tl: kilo, en: kg }
        item: { tl: lechon na baboy, en: roast pork (lechon) }
        note: { tl: hiniwa, en: sliced }
      - amount: 1
        unit: { tl: lata, en: can }
        item: liver spread
      - amount: 1
        unit: { tl: tasa, en: cup }
        item: { tl: suka, en: vinegar }
      - amount: 1/2
        unit: { tl: tasa, en: cup }
        item: { tl: asukal na pula, en: brown sugar }
      - amount: 1
        unit: { tl: kutsara, en: tbsp }
        item: { tl: asin, en: salt }
      - amount: 1
        unit: { tl: kutsara, en: tbsp }
        item: { tl: pamintang buo, en: whole peppercorns }
      - amount: 4
