steps:
  - steps:
      - tl: Banlian ang dila at kayurin ang maputing balat.
        en: Blanch the tongue in boiling water and scrape off the white skin.
      - tl: >-
          Papulahin sa mantika ang pinitpit na bawang, isunod ang sibuyas at kamatis. Timplahan ng
          toyo't paminta bago ihalo ang hamon o bacon na hiniwang pahaba.
        en: >-
          Brown the crushed garlic in oil, then add the onions and tomatoes. Season with soy sauce
          and pepper before adding the ham or bacon, cut into strips.
      - tl: >-
          Makaraan ang ilang sandaling pagkulo'y ihulog ang dila (buo) at dagdagan ng kaunting
          tubig upang makuluang mabuti ang dila.
        en: >-
          After it has simmered for a while, add the whole tongue and a little water so the tongue
          cooks through.
      - tl: Kapag kumukulo na'y ibuhos ang alak at takpan. Gatungan hanggang sa lumambot ang dila.
        en: Once boiling, pour in the wine and cover. Keep cooking until the tongue is tender.
      - tl: >-
          Paghiwa-hiwain ang dila kapag ihahain na at buhusan sa ibabaw ng salsang pinagpakuluan
          dito.
        en: To serve, slice the tongue and pour the cooking sauce over it.
