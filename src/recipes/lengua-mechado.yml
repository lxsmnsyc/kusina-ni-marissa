title: Lengua Mechado
summary:
  tl: Buong dila ng baka na pinalambot sa sarsang kamatis na may hamon at alak.
  en: Whole beef tongue braised in a tomato sauce with ham and wine.
category: ulam
tags: [beef, lengua, tomato]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1
        item: { tl: dila ng baka, en: beef tongue }
      - amount: 1
        unit: { tl: lata, en: can }
        item: tomato sauce
      - amount: 3
        item: { tl: kamatis na sariwa, en: fresh tomatoes }
      - amount: 2
        item: { tl: sibuyas, en: onions }
        note: { tl: hiniwang maliliit, en: finely chopped }
      - amount: 5
        unit: { tl: hiwa, en: slice }
        item: { tl: hamon o bacon, en: ham or bacon }
        note: { tl: manipis, en: thin }
      - amount: 4
        unit: { tl: butil, en: clove }
        item: { tl: bawang, en: garlic }
        note: { tl: pinitpit, en: crushed }
      - amount: 1/2
        unit: { tl: puswelo, en: cup }
        item: { tl: alak, en: wine }
      - item: { tl: toyo, en: soy sauce }
      - item: { tl: paminta, en: pepper }
      - item: { tl: asin, en: salt }

