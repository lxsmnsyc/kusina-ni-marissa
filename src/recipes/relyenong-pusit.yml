review:
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: I-marinate ang pusit sa toyo at katas ng lemon nang 30 minuto.
        en: Marinate the squid in the soy sauce and lemon juice for 30 minutes.
      - tl: Igisa ang bawang, sibuyas, kamatis at kintsay.
        en: Sauté the garlic, onion, tomato and Chinese celery.
      - tl: Ilagay ang giniling at lutuin.
        en: Add the ground pork and cook.
      - tl: Idagdag ang carrots at patatas, at timplahan ng asin at paminta.
        en: Add the carrot and potato, and season with salt and pepper.
      - tl: >-
          Kapag luto na, palamigin. Isama ang kalahati ng binating itlog, at palamanan na ang pusit.
        en: When cooked, let cool. Mix in half the beaten egg, then stuff the squid.
      - tl: Lagyan ng toothpick ang bukas na bahagi.
        en: Close the open end with a toothpick.
      - tl: Pagulungin sa itlog at sa harina.
        en: Roll in the remaining egg, then in flour.
      - tl: Magpainit ng mantika at i-pan-fry na ang pusit.
        en: Heat the oil and pan-fry the squid.
      - tl: Lutuin ang magkabilang bahagi nang 3 minuto.
        en: Cook each side for 3 minutes.

notes:
  - tl: Huwag i-overcook ang pusit upang manatiling malambot at hindi makunat.
    en: Do not overcook the squid, so it stays tender and not rubbery.
