title:
  tl: Relyenong Pusit
  en: Stuffed Squid
summary:
  tl: Pusit na pinalamanan ng giniling na baboy at gulay, binalot sa itlog at harina at prinito.
  en: Squid stuffed with ground pork and vegetables, coated in egg and flour and pan-fried.
category: ulam
image: photos/relyenong-pusit.png
tags: [squid, seafood, ground pork, fried]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1/2
        unit: { tl: kilo, en: kg }
        item: { tl: pusit, en: squid }
        note: { tl: nilinis, en: cleaned }
      - amount: 1/4
        unit: lb
        item: { tl: giniling na baboy, en: ground pork }
      - amount: 1
        item: { tl: katamtamang laking carrot, en: medium carrot }
        note: { tl: hiniwang pino, en: finely diced }
      - amount: 1
        item: { tl: katamtamang laking patatas, en: medium potato }
        note: { tl: hiniwang pino, en: finely diced }
      - amount: 2
        unit: { tl: tangkay, en: stalk }
        item: { tl: kintsay, en: Chinese celery }
        note: { tl: tinadtad nang pino, en: finely chopped }
      - amount: 1
        item: { tl: katamtamang laking sibuyas, en: medium onion }
        note: { tl: hiniwang pino, en: finely chopped }
      - amount: 4
        unit: { tl: butil, en: clove }
        item: { tl: bawang, en: garlic }
        note: { tl: hiniwang pino, en: minced }
      - amount: 1
        item: { tl: katamtamang laking kamatis, en: medium tomato }
        note: { tl: hiniwang pino, en: finely chopped }
      - amount: 1
        item: lemon
        note: { tl: kinatas, en: juiced }
      - amount: 1/2
        unit: { tl: tasa, en: cup }
        item: { tl: toyo, en: soy sauce }
      - item: { tl: asin, en: salt }
      - item: { tl: paminta, en: pepper }
      - amount: 2
        item: { tl: itlog, en: eggs }
        note: { tl: binati, en: beaten }
      - amount: 1/2
