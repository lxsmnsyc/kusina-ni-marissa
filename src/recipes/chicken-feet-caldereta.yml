title: Chicken Feet Caldereta
subtitle: { en: Chicken feet caldereta, tl: Kalderetang paa ng manok }
summary:
  en: Slow-cooked chicken feet stewed in tomato sauce and liver spread with potatoes, bell peppers and cheese.
  tl: Malambot na paa ng manok na niluto sa tomato sauce at liver spread, may patatas, bell pepper at keso.
category: ulam
image: photos/chicken-feet-caldereta.png
tags: [chicken, caldereta, tomato sauce, pressure cooker]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1
        unit: kg
        item: { en: chicken feet, tl: paa ng manok }
        note: { en: cleaned and cooked until tender, tl: nilinis at pinalambot }
      - amount: 1/4
        unit: cup
        item: { en: vinegar or pineapple juice, tl: suka o pineapple juice }
      - amount: 1/4
        unit: cup
        item: { en: soy sauce, tl: toyo }
      - amount: 2
        unit: { tl: butil, en: clove }
        item: { en: garlic, tl: bawang }
        note: { en: minced, tl: tinadtad }
      - amount: 1
        item: { en: onion, tl: sibuyas }
        note: { en: chopped, tl: tinadtad }
      - amount: 500
        unit: g
        item: tomato sauce
      - amount: 1
        unit: small can
        item: liver spread
      - amount: 2
        item: { en: medium potatoes, tl: katamtamang laki ng patatas }
        note: { en: cubed, tl: hiniwa nang pa-cube }
      - amount: 2
        item: { en: red and green bell peppers, tl: pula at berdeng bell pepper }
        note: { en: cubed, tl: hiniwa nang pa-cube }
      - amount: 1/2
        unit: cup
        item: { en: cheddar cheese, tl: cheddar cheese }
        note: { en: grated or cubed, tl: ginadgad o hiniwa nang pa-cube }
      - item: { en: cooking oil, tl: mantika }
      - item: { en: salt and pepper, tl: asin at paminta }
        note: { en: to taste, tl: ayon sa panlasa }
  - title: { en: Optional, tl: Opsyonal }
    items:
      - amount: 1
        item: { en: medium carrot, tl: katamtamang laki ng carrot }
        note: { en: cubed, tl: hiniwa nang pa-cube }
      - amount: 2
        item: { en: red chilies (siling labuyo), tl: siling labuyo }
        note: { en: chopped, tl: tinadtad }
      - amount: 2
        item: { en: bay leaves, tl: dahon ng laurel }

review:
  - The vinegar or pineapple juice, soy sauce and bay leaves are listed, but no step uses them.
  - Step 4 cooks the potatoes and carrots for only 2 minutes, which is not enough to make them tender.
  - The broth in step 3 is probably the liquid from cooking the chicken feet, but the recipe does not say so or how much.
  - The Tagalog translation was written during conversion.

steps:
  - title: { en: Cook the chicken feet, tl: Palambutin ang paa ng manok }
    steps:
      - en: Clean the chicken feet thoroughly.
        tl: Linising mabuti ang paa ng manok.
      - en: >-
          Cook over low heat until tender. Marissa cooks them for at least 5 hours; a pressure
          cooker takes an hour or less.
        tl: >-
          Lutuin sa mahinang apoy hanggang lumambot. Hindi bababa sa 5 oras ang pagluluto namin
          dito; kung pressure cooker, isang oras o mas maikli pa.
  - title: { en: Caldereta, tl: Kaldereta }
    steps:
      - en: In a pan, heat the oil and sauté the garlic and onion until translucent.
        tl: Sa isang kawali, magpainit ng mantika at igisa ang bawang at sibuyas hanggang lumambot.
      - en: Add the cooked chicken feet and keep sautéing until lightly browned.
        tl: Ilagay ang nilutong paa ng manok at ituloy ang paggisa hanggang bahagyang pumula.
      - en: Pour in some broth and the tomato sauce, and simmer for 3 minutes.
        tl: Ibuhos ang kaunting sabaw at ang tomato sauce, at pakuluan nang 3 minuto.
      - en: Add the liver spread, potatoes, carrot, chili and bell peppers, and cook for 2 minutes.
        tl: Ilagay ang liver spread, patatas, carrot, sili at bell pepper, at lutuin nang 2 minuto.
      - en: Season to taste, then add the cheese and stir until it melts.
        tl: Timplahan ayon sa panlasa, saka ilagay ang keso at haluin hanggang matunaw.
      - en: Remove from the heat and serve hot with steamed rice.
        tl: Hanguin at ihain nang mainit kasama ng kanin.
