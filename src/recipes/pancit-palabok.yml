steps:
  - steps:
      - tl: Ibabad ang bihon sa tubig bago ilubog sa kumukulong tubig.
        en: Soak the noodles in water before cooking them in boiling water.
      - tl: Sa isang kawali, iprito ang hinimay na tinapa hanggang sa matusta nang bahagya.
        en: In a pan, fry the flaked smoked fish until lightly toasted.
      - tl: >-
          Sa isang talyasi o malaking kawali, iprito ang bawang sa mantika hanggang sa pumula.
          Hanguin sa isang lalagyan.
        en: >-
          In a wide pan or wok, fry the garlic in the oil until golden. Transfer to a bowl.
      - tl: >-
          Isunod na ang sibuyas para maigisa. Ilagay na rin ang giniling na baboy at timplahan ng
          asin at paminta. Halu-haluin hanggang sa mawala ang pagka-pink ng karne.
        en: >-
          Sauté the onion in the same oil. Add the ground pork and season with salt and pepper.
          Stir until the meat is no longer pink.
      - tl: >-
          Ilagay na ang kalahati ng tinustang tinapa at kalahati ng dinurog na chicharon. Ilagay na
          rin ang binabad na loaf bread, shrimp cubes at achuete oil. Ilagay na rin ang tinunaw na
          cornstarch. (Kapag masyadong malapot, dagdagan ng kaunting tubig. Kapag naman malabnaw,
          dagdagan ng cornstarch. Kayo na po ang bahalang mag-adjust sa nais ninyong lapot ng
          sauce.) Timplahan na rin ng patis. Halu-haluin.
        en: >-
          Add half the toasted fish and half the crushed chicharon. Add the soaked bread, shrimp
          cubes and annatto oil, then the dissolved cornstarch. (If it gets too thick, add a little
          water; if too thin, add more cornstarch. Adjust to the thickness you like.) Season with
          fish sauce and stir.
      - tl: Tikman ang sauce at i-adjust ang lasa.
        en: Taste the sauce and adjust the seasoning.
      - tl: >-
          Magpakulo ng tubig sa isang kaserola. Kapag kumulo na, ilagay na ang binabad na bihon.
          Hayaang maluto at saka i-drain.
        en: >-
          Boil water in a pot. When it boils, add the soaked noodles. Cook, then drain.
      - tl: >-
          Ihalo ang nilutong bihon sa ginawang palabok sauce. Haluing mabuti hanggang sa ma-coat
          ng sauce ang lahat ng noodles.
        en: Toss the cooked noodles in the palabok sauce until all the noodles are coated.
      - tl: Hanguin sa isang bilao na may dahon ng saging o sa isang lalagyan.
        en: Transfer to a banana-leaf-lined bilao or a serving dish.
      - tl: >-
          Ibudbod sa ibabaw ang natitirang tinapa at chicharon. Ilagay din ang hiniwang nilagang
          itlog, tinadtad na kintsay at ang piniritong bawang.
        en: >-
          Top with the rest of the smoked fish and chicharon, the sliced eggs, chopped Chinese
          celery and fried garlic.
