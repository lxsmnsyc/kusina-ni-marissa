title: Pancit Palabok
summary:
  tl: >-
    Bihon na may malapot na sarsang may giniling, tinapa at chicharon, may itlog, kintsay at
    piniritong bawang sa ibabaw.
  en: >-
    Rice noodles in a thick sauce with ground pork, smoked fish and chicharon, topped with egg,
    Chinese celery and fried garlic.
category: kanin-at-pansit
tags: [noodles, pancit, pork, tinapa]
addedOn: "2026-10-13"

