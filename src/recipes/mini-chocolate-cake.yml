title: Mini Chocolate Cake
subtitle: { tl: Sariling bersyon, en: Own version }
summary:
  tl: Maliliit na steamed chocolate cake na may chocolate frosting at marshmallow sa ibabaw.
  en: Small steamed chocolate cakes with chocolate frosting and marshmallow toppings.
category: merienda
image: photos/mini-chocolate-cake.png
