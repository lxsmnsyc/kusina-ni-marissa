title: Banana Cake
summary:
  en: Moist steamed banana cake made with mashed bananas and evaporated milk.
  tl: Malambot na steamed banana cake na gawa sa dinurog na saging at evaporated milk.
category: merienda
image: photos/banana-cake.png
tags: [banana, cake, steamed]
addedOn: "2026-10-13"

