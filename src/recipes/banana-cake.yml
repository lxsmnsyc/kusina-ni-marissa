review:
  - The photo shows small cupcakes in paper liners, but step 3 pours the batter into one greased pan. Check which one Marissa uses.
  - The original was written in English. The user chose to keep it (2026-10-13).
  - The Tagalog translation was written during conversion.

steps:
  - steps:
      - en: >-
          Sift the flour, sugar, salt, baking powder and baking soda together. Mix the dry
          ingredients thoroughly until evenly distributed.
        tl: >-
          Salain nang sabay ang harina, asukal, asin, baking powder at baking soda. Haluing mabuti
          ang mga tuyong sangkap hanggang pantay ang pagkakahalo.
      - en: >-
          In a separate bowl, mix the eggs, mashed banana, butter, vanilla and evaporated milk. Then
          mix well with the dry ingredients until a batter forms.
        tl: >-
          Sa ibang mangkok, paghaluin ang itlog, dinurog na saging, butter, vanilla at evaporated
          milk. Saka ihalo nang mabuti sa mga tuyong sangkap hanggang maging batter.
      - en: Grease the pan with butter and pour in the batter.
        tl: Pahiran ng butter ang lalagyan at ibuhos ang batter.
      - en: Steam for 20 to 30 minutes.
        tl: I-steam nang 20 hanggang 30 minuto.
