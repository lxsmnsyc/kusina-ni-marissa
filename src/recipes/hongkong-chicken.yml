title: Hongkong Chicken
summary:
  tl: >-
    Buong manok na pinakuluan sa toyo at star anise, pinirito, at hinainan ng sarsang oyster sauce
    na may gulay at tengang daga.
  en: >-
    Whole chicken simmered in soy sauce and star anise, fried, and served with an oyster sauce
    gravy with vegetables and wood ear mushrooms.
category: ulam
image: photos/hongkong-chicken.png
tags: [chicken, star anise, oyster sauce]
addedOn: "2026-10-13"

ingredients:
  - title: { tl: Para sa manok, en: For the chicken }
    items:
      - amount: 1
        item: { tl: buong manok, en: whole chicken }
      - amount: 3
        unit: tbsp
        item: { tl: toyo, en: soy sauce }
      - amount: 1
        item: { tl: sibuyas, en: onion }
      - amount: 5
        unit: { tl: butil, en: clove }
        item: { tl: bawang, en: garlic }
      - amount: 2
        item: { tl: luya, en: ginger }
      - amount: 3
        item: star anise
      - item: { tl: tubig, en: water }
  - title: { tl: Para sa sauce, en: For the sauce }
    items:
      - amount: 3
        unit: { tl: butil, en: clove }
        item: { tl: bawang, en: garlic }
      - amount: 1
        item: { tl: sibuyas, en: onion }
      - amount: 1
        item: { tl: luya, en: ginger }
        note: { tl: kasinlaki ng hinlalaki, en: thumb-size piece }
      - amount: 3
