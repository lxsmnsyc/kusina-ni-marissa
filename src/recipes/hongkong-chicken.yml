review:
  - '"5 bawang" and "3 Bawang" have no unit. Recorded as cloves (butil).'
  - '"2 luya" has no unit. It probably means 2 thumb-size pieces.'
  - '"Tinunaw sa tbsp na tubig" has no number. Recorded as 1 tbsp.'
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: >-
          Pakuluan ang manok sa toyo, sibuyas, bawang, luya, star anise at tamang dami ng tubig
          para sa manok.
        en: >-
          Simmer the chicken with the soy sauce, onion, garlic, ginger, star anise and enough water
          to cook it.
      - tl: Prituhin ang manok at itabi.
        en: Fry the chicken and set aside.
      - tl: Igisa ang sibuyas, bawang, luya at star anise sa mantika.
        en: Sauté the onion, garlic, ginger and star anise in oil.
      - tl: Ilagay ang oyster sauce, carrots at ang tengang daga.
        en: Add the oyster sauce, carrots and wood ear mushrooms.
      - tl: Ilagay ang pinagpakuluan ng manok at pakuluin.
        en: Add the chicken cooking liquid and bring to a boil.
      - tl: Lagyan ng asukal at ang sitsaro.
        en: Add the sugar and snow peas.
      - tl: Ilagay ang pechay Baguio.
        en: Add the Napa cabbage.
      - tl: Palaputin sa pamamagitan ng paglagay ng cornstarch na tinunaw sa tubig.
        en: Thicken with the dissolved cornstarch.
      - tl: I-chop ang manok at ilagay ang sauce.
        en: Chop the chicken and pour the sauce over it.
