title: No-Bake Beef Lasagna
summary:
  tl: Lasagna na may beef sauce at white sauce na hindi na kailangang i-bake.
  en: Layered lasagna with a beef sauce and a creamy white sauce, no oven needed.
category: kanin-at-pansit
tags: [beef, pasta, cheese, no-bake]
addedOn: "2026-10-13"

