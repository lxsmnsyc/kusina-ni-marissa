review:
  - No photo. The one supplied looked like a recipe-site photo and showed a baked red-sauce lasagna, not this one. Add Marissa's own photo.
  - The original lists "2 pcs. medium size Garlic chopped" after the minced garlic. Changed to onions, because step 2 sautés garlic and onion and no onion was listed.
  - The original ingredient list is in English, so it is shown the same in both languages.
  - The recipe uses Del Monte and Maggi products and may come from a food blog or brand page. Check before publishing publicly.
  - The English translation of the steps was written during conversion.

steps:
  - steps:
      - tl: >-
          Lutuin ang lasagna pasta sheets according to package direction. Lutuin itong mabuti
          komo hindi nga natin ito ibe-bake. Make sure lang na hindi magkadurog-durog ang bawat
          sheet.
        en: >-
          Cook the lasagna sheets according to the package directions. Cook them well, since the
          dish will not be baked. Make sure the sheets do not fall apart.
      - tl: Sa isang kawali, igisa ang bawang at sibuyas sa olive oil.
        en: In a pan, sauté the garlic and onions in olive oil.
      - tl: >-
          Sunod na ilagay ang ground beef at timplahan na rin ng asin at paminta. Hayaang maluto
          hanggang sa mawala ang pagka-pink ng karne.
        en: >-
          Add the ground beef and season with salt and pepper. Cook until the meat is no longer
          pink.
      - tl: >-
          Sunod na ilagay ang 4 cheese pasta sauce, chopped fresh basil leaves at brown sugar.
          Hayaang kumulo nang mga 10 minuto.
        en: >-
          Add the 4 cheese pasta sauce, chopped fresh basil and brown sugar. Simmer for about 10
          minutes.
      - tl: Huling ilagay ang grated cheese.
        en: Add the grated cheese last.
      - tl: Tikman ang sauce at i-adjust ang lasa.
        en: Taste the sauce and adjust the seasoning.
      - tl: Alisin muna sa apoy.
        en: Remove from the heat.
  - title: To assemble
    steps:
      - tl: Sa isang square baking dish, ihilera ng 1 layer sa base ang nilutong lasagna.
        en: In a square baking dish, lay 1 layer of the cooked lasagna on the bottom.
      - tl: >-
          Lagyan ng nilutong beef ang unang layer. Lagyan muli ng lasagna sheets at i-alternate
          lang ang paglalagay.
        en: >-
          Spread the cooked beef over the first layer. Add another layer of lasagna sheets and keep
          alternating.
  - title: For the sauce
    steps:
      - tl: Sa isang sauce pan, ilagay ang butter hanggang sa matunaw ito.
        en: In a saucepan, melt the butter.
      - tl: Sunod na ilagay ang harina at halu-haluin.
        en: Add the flour and stir.
      - tl: >-
          Sunod na ilagay ang all purpose cream at full cream milk. Timplahan na rin ng asin,
          paminta at Maggi Magic Sarap.
        en: >-
          Add the all-purpose cream and full cream milk. Season with salt, pepper and Maggi Magic
          Sarap.
      - tl: >-
          Patuloy na haluin. Maaaring lagyan pa ng milk para makuha ang malapot na consistency ng
          sauce.
        en: Keep stirring. Add more milk if needed to get a thick sauce.
      - tl: Tikman at i-adjust ang lasa.
        en: Taste and adjust the seasoning.
      - tl: >-
          Ibuhos ang white sauce na niluto sa ibabaw ng layered na beef lasagna. Dahan-dahan ang
          gawing pagbuhos para hindi kumalat ang sauce ng beef.
        en: >-
          Pour the white sauce over the layered beef lasagna. Pour slowly so the beef sauce does not
          spread.
      - tl: >-
          Budburan ng grated cheese pa sa ibabaw. Budburan din ng dried basil leaves sa ibabaw.
        en: Sprinkle more grated cheese on top, then the dried basil.
      - tl: Hayaan munang lumamig nang bahagya bago i-slice o i-serve.
        en: Let it cool slightly before slicing and serving.
