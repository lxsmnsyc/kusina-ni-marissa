title: Chicken Cordon Bleu
summary:
  tl: Pitso ng manok na binilot na may ham at keso, binalot sa breadcrumbs at prinito, may cream sauce.
  en: Chicken breast rolled around ham and cheese, breaded and fried, with a creamy sauce.
category: ulam
image: photos/chicken-cordon-bleu.png
tags: [chicken, ham, cheese, fried]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 8
        item: { tl: pitso ng manok, en: chicken breast }
        note: fillet
      - amount: 4
        unit: { tl: piraso, en: slice }
        item: sweet ham
        note: { tl: hatiin sa gitna, en: cut in half }
      - amount: 1/2
        unit: bar
        item: { tl: keso, en: cheese }
        note: { tl: hiniwang ½″ × ½″ na sticks, en: cut into ½″ × ½″ sticks }
      - item: { tl: asin, en: salt }
      - item: { tl: paminta, en: pepper }
      - amount: 1
        unit: cup
        item: all-purpose flour
      - amount: 2
        item: { tl: itlog, en: eggs }
        note: { tl: binati, en: beaten }
      - amount: 1
        unit: cup
        item: breadcrumbs
  - title: Sauce
    items:
      - amount: 1
        item: chicken cube
      - amount: 6
        item: { tl: keso stick, en: cheese sticks }
