review:
  - The original title says "Cordon Blue". Changed to "Cordon Bleu".
  - The sauce has a single step and does not say in what order to cook the ingredients.
  - No oil is listed for frying.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: Hugasan ang manok at patuluin.
        en: Wash the chicken and let it drain.
      - tl: Pag natulo na, lagyan ng asin at paminta. Itabi.
        en: Once drained, season with salt and pepper. Set aside.
      - tl: Sa isang bowl, timplahan ng asin at paminta ang harina. Ganoon din ang gawin sa breadcrumbs.
        en: In a bowl, season the flour with salt and pepper. Do the same with the breadcrumbs.
      - tl: "Iayos ang mga bowl nang sunod-sunod: harina, itlog, breadcrumbs."
        en: "Line up the bowls in order: flour, egg, breadcrumbs."
      - tl: >-
          I-flat ang pitso. Lagyan ng ham at keso, at bilutin o gawing isang log. Lagyan ng
          toothpick ang mga dulo.
        en: >-
          Flatten the chicken breast. Top with ham and cheese, then roll into a log. Secure the ends
          with toothpicks.
      - tl: >-
          I-dip sa 3 bowl ayon sa pagkakasunod-sunod. Habang dini-dip, paikutin para malagyan ang
          buo.
        en: Dip into the 3 bowls in order, turning to coat all over.
      - tl: >-
          Ilagay sa ref nang magdamag at kinabukasan iprito. Kung umaga gagawin, sa gabi iprito.
        en: >-
          Refrigerate overnight and fry the next day. If you make them in the morning, fry them in
          the evening.
  - title: Sauce
    steps:
      - tl: Lutuin sa mahinang apoy. Timplahan ng asin ayon sa panlasa.
        en: Cook the sauce ingredients over low heat. Season with salt to taste.
