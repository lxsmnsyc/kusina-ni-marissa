title:
  en: Lengua in Mushroom Sauce
  tl: Lengua sa Mushroom Sauce
summary:
  en: Beef tongue simmered until fork-tender, sliced and cooked in a creamy mushroom sauce.
  tl: Dila ng baka na pinalambot, hiniwa at niluto sa malapot na mushroom sauce.
category: ulam
tags: [beef, lengua, mushroom, creamy]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 3
        unit: lb
        item: { en: beef tongue, tl: dila ng baka }
      - item: { en: water, tl: tubig }
      - amount: 1
        item: { en: small onion, tl: maliit na sibuyas }
        note: { en: peeled and quartered, tl: binalatan at hiniwa sa apat }
      - amount: 1
        unit: { en: head, tl: ulo }
        item: { en: garlic, tl: bawang }
        note: { en: peeled and crushed, tl: binalatan at dinikdik }
      - amount: 2
        item: { en: bay leaves, tl: dahon ng laurel }
      - amount: 1
        unit: tsp
        item: { en: peppercorns, tl: buong paminta }
      - item: { en: salt, tl: asin }
      - amount: 1
        unit: { en: can, tl: lata }
        item: condensed cream of mushroom soup
        note: 10 oz
      - amount: 2
        unit: cup
        item: { en: beef broth, tl: sabaw ng baka }
        note: { en: reserved from boiling the tongue, tl: mula sa pinagpakuluan ng dila }
      - amount: 2
        unit: tbsp
        item: { en: butter, tl: mantikilya }
      - amount: 8
        unit: oz
        item: button mushrooms
        note: { en: "sliced, fresh or canned", tl: "hiniwa, sariwa o de-lata" }
      - amount: 1
        item: { en: small onion, tl: maliit na sibuyas }
        note: { en: peeled and chopped, tl: binalatan at tinadtad }
      - item: { en: pepper, tl: paminta }
        note: { en: to taste, tl: ayon sa panlasa }

review:
  - Step 2 reserves 3 cups of broth, but the ingredients and step 3 use only 2 cups.
  - Step 4 sets the browned mushrooms aside, and no later step adds them back.
  - Step 2 uses about 2 tablespoons of salt, but the ingredient list only says "salt".
  - The wording may come from a recipe website (possibly Kawaling Pinoy). Check before publishing publicly.
  - The photo was removed because it likely came from a recipe website. Add Marissa's own photo.
  - The Tagalog translation was written during conversion.

steps:
  - steps:
      - en: >-
          In a deep pot over medium heat, combine the beef tongue and enough water to cover. Bring
          to a boil for about 10 to 15 minutes, skimming any scum that floats to the top. Drain the
          tongue and rinse well. Discard the liquid and wash the pot.
        tl: >-
          Sa isang malalim na kaserola sa katamtamang apoy, pagsamahin ang dila ng baka at sapat na
          tubig para lumubog ito. Pakuluan nang mga 10 hanggang 15 minuto, at alisin ang bulang
          lumulutang sa ibabaw. Patuluin ang dila at hugasang mabuti. Itapon ang pinagkuluan at
          hugasan ang kaserola.
      - en: >-
          Return the tongue to the pot and add enough water to cover. Add the onion, garlic, bay
          leaves, peppercorns and about 2 tablespoons of salt. Over medium heat, bring to a boil.
          Lower the heat, cover and simmer for about 4 to 5 hours, or until the meat is
          fork-tender. Add more water as needed during cooking to keep the tongue covered. Drain,
          reserving 3 cups of the broth. Strain and discard the aromatics. Allow the tongue to cool
          slightly, then refrigerate for about 1 to 2 hours, or until completely cooled (this makes
          slicing easier). Peel the skin and cut the meat diagonally into ½-inch slices.
        tl: >-
          Ibalik ang dila sa kaserola at lagyan ng tubig hanggang lumubog. Idagdag ang sibuyas,
          bawang, dahon ng laurel, buong paminta at mga 2 kutsarang asin. Pakuluan sa katamtamang
          apoy. Hinaan ang apoy, takpan at hayaang kumulo nang mga 4 hanggang 5 oras, o hanggang
          lumambot ang karne. Dagdagan ng tubig kung kailangan para laging nakalubog ang dila.
          Hanguin, at magtabi ng 3 tasang sabaw. Salain at itapon ang mga pampalasa. Palamigin nang
          bahagya ang dila, saka ilagay sa refrigerator nang mga 1 hanggang 2 oras, o hanggang
          tuluyang lumamig (mas madali itong hiwain). Balatan at hiwain nang pahilis, mga ½ pulgada
          ang kapal.
      - en: In a bowl, combine the cream of mushroom soup and the reserved broth. Stir until well blended and smooth.
        tl: Sa isang mangkok, paghaluin ang cream of mushroom soup at ang itinabing sabaw. Haluin hanggang pantay at makinis.
      - en: >-
          In a pot over medium heat, melt the butter. Add the mushrooms and cook, stirring
          regularly, until lightly browned. Remove from the pan and set aside.
        tl: >-
          Sa isang kaserola sa katamtamang apoy, tunawin ang mantikilya. Idagdag ang mushroom at
          lutuin, palaging hinahalo, hanggang bahagyang pumula. Hanguin at itabi.
      - en: >-
          Add the onion and cook until limp. Add the beef tongue and cook, stirring regularly, for
          about 1 to 2 minutes. Add the mushroom soup and broth mixture and bring to a boil. Season
          with salt and pepper to taste. Continue to cook for about 10 to 15 minutes, or until the
          sauce is slightly reduced.
        tl: >-
          Idagdag ang sibuyas at lutuin hanggang lumambot. Idagdag ang dila at lutuin, palaging
          hinahalo, nang mga 1 hanggang 2 minuto. Ibuhos ang pinaghalong mushroom soup at sabaw at
          pakuluan. Timplahan ng asin at paminta ayon sa panlasa. Ituloy ang pagluluto nang mga 10
          hanggang 15 minuto, o hanggang bahagyang lumapot ang sarsa.
