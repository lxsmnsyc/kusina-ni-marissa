title: Buko Pandan Salad
summary:
  tl: Kinayod na buko, pandan gulaman, kaong, nata de coco at keso sa matamis na cream.
  en: Young coconut, pandan gelatin, kaong, nata de coco and cheese in sweet cream.
category: panghimagas
tags: [buko, pandan, gulaman, no-bake]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 5
        item: buko
        note: { tl: kinayod, en: meat scraped into strips }
      - amount: 1
        unit: { tl: pakete, en: pack }
        item: { tl: Mr. Gulaman (green), en: green Mr. Gulaman }
      - amount: 1
        unit: tbsp
        item: pandan essence
      - amount: 1
        unit: { tl: lata, en: can }
        item: all-purpose cream
      - amount: 1
        unit: { tl: lata, en: can }
        item: { tl: gatas kondensada, en: condensed milk }
      - amount: 1
        unit: { tl: bote, en: bottle }
        item: { tl: green kaong, en: green kaong (sugar palm fruit) }
      - amount: 1
        unit: { tl: bote, en: bottle }
        item: { tl: puting nata de coco, en: white nata de coco }
      - amount: 1
        unit: { tl: tasa, en: cup }
        item: { tl: keso, en: cheese }
        note: { tl: hiniwang pakuwadrado, en: cubed }
      - amount: 5
        unit: { tl: tasa, en: cup }
        item: { tl: sabaw ng buko, en: coconut water }
        note: { tl: o tubig, en: or water }

review:
  - No photo was sent with this recipe.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: >-
          Isalang ang kaserola at ilagay ang 5 tasa ng sabaw ng buko o tubig. Ilagay ang powder
          gulaman at haluin. Ilagay ang pandan essence. Kapag malapot na at mabigat nang haluin,
          patayin ang apoy at palamigin.
        en: >-
          Heat a pot with the 5 cups of coconut water or water. Stir in the gulaman powder, then the
          pandan essence. When it thickens and gets heavy to stir, turn off the heat and let it set.
      - tl: >-
          Habang pinapalamig ang gulaman, kumuha ng salaan. Pagsamahin ang nata de coco at kaong at
          patuluin nang 5 minuto, o hanggang sa mawala ang katas nito.
        en: >-
          While the gulaman sets, drain the nata de coco and kaong together in a strainer for 5
          minutes, or until all the syrup is gone.
      - tl: Ilagay sa isang mixing bowl ang buko, nata de coco at kaong.
        en: Put the buko, nata de coco and kaong in a mixing bowl.
      - tl: Idagdag ang condensed milk at all-purpose cream. Haluing mabuti.
        en: Add the condensed milk and cream. Mix well.
      - tl: Hiwain nang pa-diced ang pinalamig na gulaman at ihalo sa buko mixture.
        en: Dice the set gulaman and fold it into the buko mixture.
      - tl: Isunod na ilagay ang keso.
        en: Add the cheese.
      - tl: Ilagay sa refrigerator at palamigin.
        en: Chill in the refrigerator.
