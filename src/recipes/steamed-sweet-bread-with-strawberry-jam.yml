title: Steamed Sweet Bread with Strawberry Jam
subtitle: { tl: Gawa sa pancake mix, en: Made with pancake mix }
summary:
  tl: Malambot na steamed bread na gawa sa pancake mix, may strawberry jam sa loob at ibabaw.
  en: Soft steamed bread made with pancake mix, with strawberry jam swirled in and on top.
category: merienda
tags: [steamed, bread, strawberry, pancake mix]
servings: 8
addedOn: "2026-10-13"

