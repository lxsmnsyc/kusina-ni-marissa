steps:
  - steps:
      - tl: Pagsama-samahin ang may ☆ markang ingredients sa 1 bowl.
        en: Combine the ☆ ingredients in a bowl.
      - tl: Ilagay ang mixture sa mga silicone cups, 60% puno.
        en: Fill silicone cups 60% full with the mixture.
      - tl: Maglagay ng 1 tsp ng strawberry jam sa bawat cup and stir 2 to 3 times.
        en: Put 1 tsp of strawberry jam in each cup and stir 2 to 3 times.
      - tl: Maglagay ng tubig sa steamer. Pakuluin at ilagay na ang mga mixture na nasa mga cups.
        en: Put water in the steamer. Bring it to a boil, then put in the filled cups.
      - tl: Lutuin nang 12 minuto sa mahinang apoy.
        en: Cook for 12 minutes over low heat.
      - tl: Pagkatapos ng 12 minuto, mag-toothpick test kung ito'y luto na.
        en: After 12 minutes, test with a toothpick to see if they are done.
      - tl: Kapag ihahain, lagyan ng strawberry jam sa ibabaw.
        en: When serving, top with strawberry jam.
