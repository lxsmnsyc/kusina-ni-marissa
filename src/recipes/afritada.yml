  - items:
      - amount: 1
        unit: { tl: kilo, en: kg }
        item: { tl: manok, en: chicken }
        note: { tl: hiniwa sa katamtamang laki, en: cut into medium pieces }
      - amount: 1/2
        unit: { tl: kilo, en: kg }
        item: { tl: kasim ng baboy, en: pork shoulder (kasim) }
        note: { tl: hiniwa nang pakuwadrado, en: cubed }
      - amount: 1
