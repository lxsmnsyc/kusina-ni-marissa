review:
  - Step 1 fries the pork and chicken, but no oil is in the ingredient list.
  - The sibuyas and bawang have no preparation (chopped or crushed).
  - The photo is a wide 16:9 frame and may be a still from a video. Check where it came from before publishing publicly.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: Iprito ang kasim at manok hanggang mamula nang bahagya. Ilagay sa isang tabi.
        en: Fry the pork and chicken until lightly browned. Set aside.
      - tl: Igisa ang bawang, sibuyas at kamatis. Durugin nang maigi ang kamatis.
        en: Sauté the garlic, onions and tomatoes. Mash the tomatoes well.
      - tl: Ilagay ang kasim, laurel at suka. Pakuluin hanggang lumambot ang kasim.
        en: Add the pork, bay leaves and vinegar. Simmer until the pork is tender.
      - tl: Idagdag ang manok at patatas.
        en: Add the chicken and potatoes.
      - tl: >-
          Ihuling idagdag ang siling pula at berde. Timplahan ng asin at paminta ayon sa panlasa.
        en: Add the red and green peppers last. Season with salt and pepper to taste.
