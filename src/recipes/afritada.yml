title: Afritada
summary:
  tl: Manok at kasim ng baboy na niluto sa kamatis, kasama ng patatas at siling pula at berde.
  en: Chicken and pork stewed in tomatoes with potatoes and bell peppers.
category: ulam
image: photos/afritada.png
tags: [chicken, pork, tomato, stew]
addedOn: "2026-10-13"

