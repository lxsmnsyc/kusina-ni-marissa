title: Chicken à la King
summary:
  tl: Nilagang manok sa malapot na sarsang may cream of mushroom soup at siling pula at berde.
  en: Simmered chicken in a creamy mushroom sauce with red and green bell peppers.
category: ulam
tags: [chicken, creamy, mushroom]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1
        item: { tl: manok, en: whole chicken }
        note: { tl: pira-piraso, en: cut into pieces }
      - amount: 4
        unit: { tl: tasa, en: cup }
        item: { tl: tubig, en: water }
      - amount: 1
        unit: { tl: kutsarita, en: tsp }
        item: { tl: asin, en: salt }
      - amount: 2
