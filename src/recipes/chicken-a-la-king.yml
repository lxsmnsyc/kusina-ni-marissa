review:
  - No photo was sent with this recipe.
  - The bawang is listed but no step uses it. It probably goes into the oil before the flour.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: Ilaga ang manok na pira-piraso sa kaunting tubig na may asin hanggang lumambot.
        en: Simmer the chicken pieces in a little salted water until tender.
      - tl: Tunawin sa kaunting tubig ang harina. Ihulog sa mainit na mantika hanggang lumapot.
        en: Dissolve the flour in a little water. Pour it into the hot oil and cook until thick.
      - tl: Idagdag ang sibuyas at sili at lutuin nang mga 5 minuto.
        en: Add the onion and bell peppers and cook for about 5 minutes.
      - tl: Ihulog ang manok, kasama ang pinaglagaan.
        en: Add the chicken along with its cooking liquid.
      - tl: Idagdag ang cream of mushroom soup.
        en: Stir in the cream of mushroom soup.
