review:
  - The original step says "Isalin ang butig sa baka". Changed "butig" to "tubig" (water).
  - The sibuyas is listed but no step uses it.
  - Both celery and kintsay are listed. Kintsay is Chinese celery, so these may be the same ingredient twice.
  - '"Huwag lalabugin" is unclear. It may mean "huwag lalamugin" (do not overcook). Translated as "do not overcook".'
  - The beef is measured as 1 tasa (cup), which is unusual for meat.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: Papulahin ang kudra-kudradong baka sa pinainit na langis.
        en: Brown the cubed beef in hot oil.
      - tl: Isalin ang tubig sa baka. Ipagpatuloy ang pagluluto sa katamtamang init.
        en: Pour the water over the beef. Continue cooking over medium heat.
      - tl: Kung malambot na ang baka, ihalo ang patatas, celery, repolyo at kintsay.
        en: Once the beef is tender, add the potatoes, celery, cabbage and Chinese celery.
      - tl: Timplahan ng asin, dahong laurel, pamintang buo at pulbos na paminta.
        en: Season with salt, bay leaf, whole peppercorns and ground pepper.
      - tl: Hanguin kung luto na (huwag lalabugin) ang mga gulay.
        en: Remove from the heat once the vegetables are cooked (do not overcook).
