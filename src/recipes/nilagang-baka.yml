title: Nilagang Baka
summary:
  tl: Sabaw ng pinalambot na baka na may patatas, repolyo at celery.
  en: Tender beef simmered in a clear broth with potatoes, cabbage and celery.
category: sabaw
image: photos/nilagang-baka.png
tags: [beef, soup, vegetables, nilaga]
addedOn: "2026-10-13"

