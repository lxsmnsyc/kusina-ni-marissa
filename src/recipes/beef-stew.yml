review:
  - The photo was removed because it looked like a TV or website screenshot (possibly Food Network). Add Marissa's own photo.
  - 4 ulo ng bawang (4 heads of garlic) is a lot for 1 kilo of beef. It may mean 4 butil (cloves).
  - 2 kutsarang asin (2 tablespoons of salt) is a lot for 1 kilo of beef. Check the amount.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: >-
          Prituhin ang bacon sa isang kawali sa mahinang apoy hanggang lumabas ang mantika nito at
          maging malutong. Ilagay sa isang tabi.
        en: Fry the bacon in a pan over low heat until the fat renders and it turns crisp. Set aside.
      - tl: Sa parehong kawali, ilagay ang bawang at karne. Prituhin ang karne hanggang mamula.
        en: In the same pan, add the garlic and beef. Fry the beef until browned.
      - tl: Idagdag ang sibuyas at tomato paste. Haluin at pakuluin nang 5 minuto.
        en: Add the onion and tomato paste. Stir and simmer for 5 minutes.
      - tl: >-
          Idagdag ang tubig at laurel, at timplahan ng asin at betsin. Pakuluan hanggang lumambot
          ang karne. Dagdagan ng kaunting tubig kapag medyo natutuyuan.
        en: >-
          Add the water and bay leaf, and season with salt and MSG. Simmer until the beef is
          tender. Add a little water if it starts to dry out.
      - tl: >-
          Kapag malapit nang maluto, ilagay ang gisantes, siling pula at siling berde, carrots at
          piniritong patatas. Lutuin nang 10 minuto.
        en: >-
          When almost done, add the peas, red and green peppers, carrots and fried potatoes. Cook
          for 10 minutes.
      - tl: >-
          Para lumapot ang sabaw, lagyan ng biskotso. Palamutian ng bacon sa ibabaw kapag ihahain
          na.
        en: To thicken the sauce, add the bread crumbs. Top with the bacon when serving.
