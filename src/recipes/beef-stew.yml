title: Beef Stew
summary:
  tl: Pinalambot na baka sa tomato paste na may bacon, patatas, carrots at gisantes.
  en: Beef braised in tomato sauce with bacon, potatoes, carrots and peas.
category: ulam
tags: [beef, stew, bacon]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1
        unit: { tl: kilo, en: kg }
        item: { tl: baka, en: beef }
        note: { tl: hiniwa nang tig-1½ pulgada, en: cut into 1½-inch pieces }
      - amount: 4
        unit: { tl: piraso, en: slice }
        item: bacon
      - amount: 4
        unit: { tl: ulo, en: head }
        item: { tl: bawang, en: garlic }
        note: { tl: pinitpit, en: crushed }
      - amount: 1
        item: { tl: katamtamang laking sibuyas, en: medium onion }
        note: { tl: tinadtad, en: chopped }
      - amount: 3
        item: { tl: siling pula at berde, en: red and green bell peppers }
        note: { tl: hiniwang pahaba, en: cut into strips }
      - amount: 4-5
        item: { tl: patatas, en: potatoes }
        note:
          tl: hiniwa sa apat na bahagi at bahagyang prinito
          en: quartered and lightly fried
      - amount: 1
        unit: { tl: tasa, en: cup }
        item: { tl: gisantes, en: green peas }
      - amount: 1
        unit: { tl: maliit na lata, en: small can }
        item: tomato paste
        note: { tl: o 2 lata ng tomato sauce, en: or 2 cans of tomato sauce }
      - amount: 2
        unit: { tl: kutsara, en: tbsp }
        item: { tl: asin, en: salt }
      - amount: 2
        unit: { tl: kutsara, en: tbsp }
