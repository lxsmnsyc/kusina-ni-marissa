title: Chicken Pastel
summary:
  tl: Manok na niluto sa malapot na sarsang may gatas, kasama ng patatas at carrots.
  en: Chicken stewed in a creamy milk sauce with potatoes and carrots.
category: ulam
image: photos/chicken-pastel.png
tags: [chicken, stew, creamy]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1
        unit: { tl: kilo, en: kg }
        item:
          tl: manok o atay at balunbalunan
          en: chicken, or chicken liver and gizzards
      - amount: 1
        unit: { tl: kutsara, en: tbsp }
        item: { tl: mantika, en: cooking oil }
      - amount: 5
        unit: { tl: butil, en: clove }
        item: { tl: bawang, en: garlic }
        note: { tl: dikdikin, en: crushed }
      - amount: 1
        item: { tl: sibuyas, en: onion }
        note: { tl: pinuhin, en: finely chopped }
      - amount: 2
        unit: { tl: tasa, en: cup }
        item: { tl: tubig, en: water }
      - amount: 1
        item: chicken cube
      - amount: 1
        item: { tl: patatas, en: potato }
        note: { tl: hiwain nang pakuwadrado, en: cubed }
      - amount: 1
        item: carrot
        note: { tl: hiwain nang pakuwadrado, en: cubed }
      - amount: 1
        item: { tl: siling pula, en: red bell pepper }
      - amount: 2
        unit: { tl: kutsara, en: tbsp }
        item: cornstarch
        note: { tl: lusawin sa 2 kutsarang tubig, en: dissolved in 2 tbsp water }
      - amount: 1
        unit: { tl: kutsara, en: tbsp }
