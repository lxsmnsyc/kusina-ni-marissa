review:
  - '"Manok/atay at balunbalunan" is unclear. Recorded as chicken, or liver and gizzards. It may mean chicken plus liver and gizzards.'
  - The last line was cut off ("kng nai"). Read as "kung nais".
  - The betsin in the last step is not in the ingredient list.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: Igisa ang bawang, sibuyas at manok.
        en: Sauté the garlic, onion and chicken.
      - tl: Idagdag ang tubig at chicken cube at pakuluin.
        en: Add the water and chicken cube and bring to a boil.
      - tl: Idagdag ang patatas, carrots at siling pula. Lutuin hanggang maluto.
        en: Add the potato, carrot and red pepper. Cook until done.
      - tl: Idagdag ang lusaw na cornstarch habang hinahalo.
        en: Stir in the dissolved cornstarch.
      - tl: Idagdag ang margarine at gatas at haluin. Lagyan ng betsin kung nais.
        en: Add the margarine and milk and stir. Add MSG if you like.
