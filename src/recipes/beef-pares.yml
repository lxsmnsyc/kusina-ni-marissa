title: Beef Pares
summary:
  en: Beef braised in soy sauce and star anise until very tender, served over rice with a glossy sauce.
  tl: Malambot na baka na niluto sa toyo at star anise, inihahain sa kanin na may malapot na sarsa.
category: ulam
image: photos/beef-pares.png
tags: [beef, braise, rice]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1/2
        unit: { en: kg, tl: kilo }
        item: { en: beef, tl: baka }
        note:
          en: brisket, flank, short ribs or shank; cut into 2-inch cubes
          tl: brisket, flank, short ribs o shank; hiniwa nang tig-2 pulgadang kuwadrado
      - amount: 6
        unit: { en: clove, tl: butil }
        item: { en: garlic, tl: bawang }
      - amount: 1
        item: { en: whole onion, tl: buong sibuyas }
      - amount: 1
        item: { en: ginger, tl: luya }
        note:
          en: thumb-size piece, washed and scrubbed (no need to peel)
          tl: kasinlaki ng hinlalaki, hinugasan at kinuskos (hindi na kailangang balatan)
      - amount: 1
        unit: tsp
        item: { en: whole black peppercorns, tl: buong itim na paminta }
      - amount: 1
        item: star anise
      - amount: 1
        item: { en: bay leaf, tl: dahon ng laurel }
      - amount: 1
        unit: tsp
        item: five-spice powder
      - amount: 4
        unit: tbsp
        item: { en: soy sauce, tl: toyo }
      - amount: 4
        unit: tbsp
        item: rice wine
      - amount: 1
        unit: tsp
        item: rice wine vinegar
      - amount: 2
        unit: tbsp
        item: { en: white sugar, tl: puting asukal }
      - item: { en: salt, tl: asin }
        note: { en: to taste, tl: ayon sa panlasa }
      - amount: 1
        unit: tbsp
        item: { en: tapioca starch or cornstarch, tl: tapioca starch o cornstarch }
      - item: { en: cooked rice, tl: kanin }
        note: { en: to serve, tl: para sa paghahain }
      - item: { en: toasted garlic bits, tl: tostadong bawang }
        note: { en: to garnish, tl: pampalamuti }
      - item: { en: fried onion slices, tl: piniritong hiwa ng sibuyas }
        note: { en: to garnish, tl: pampalamuti }
      - item: { en: snipped scallions, tl: hiniwang dahon ng sibuyas }
        note: { en: to garnish, tl: pampalamuti }

review:
  - The wording reads like a food blog recipe, not Marissa's own. Check the text and photo before publishing publicly.
  - Water is used in steps 1, 2 and 6 but not listed in the ingredients.
  - The Tagalog translation was written during conversion.

steps:
  - steps:
      - en: >-
          Place the beef in a cooking pot and cover with water. Boil over high heat for five to ten
          minutes, or until the meat is no longer red. Throw out the water and rinse the beef to
          remove all traces of scum.
        tl: >-
          Ilagay ang baka sa isang kaserola at lagyan ng tubig hanggang lumubog. Pakuluan sa
          malakas na apoy nang lima hanggang sampung minuto, o hanggang hindi na pula ang karne.
          Itapon ang tubig at banlawan ang baka para maalis ang lahat ng bula.
      - en: >-
          Rinse out the pot, return the beef and cover with water once more. Add the garlic, onion,
          ginger, peppercorns, star anise, bay leaf and five-spice powder. Pour in the soy sauce,
          rice wine and rice wine vinegar. Stir in the sugar. Simmer gently for two hours, or until
          the meat is very tender.
        tl: >-
          Banlawan ang kaserola, ibalik ang baka at lagyan muli ng tubig hanggang lumubog. Idagdag
          ang bawang, sibuyas, luya, paminta, star anise, dahon ng laurel at five-spice powder.
          Ibuhos ang toyo, rice wine at rice wine vinegar. Ihalo ang asukal. Pakuluan nang marahan
          nang dalawang oras, o hanggang lumambot nang husto ang karne.
      - en: >-
          Halfway through cooking, taste the broth and add salt. Do not add more soy sauce instead
          of salt, or the broth will turn too dark.
        tl: >-
          Sa kalagitnaan ng pagluluto, tikman ang sabaw at lagyan ng asin. Huwag dagdagan ng toyo
          sa halip na asin, dahil iitim nang husto ang sabaw.
      - en: When the beef is done, scoop out the meat and transfer it to a large bowl. Keep hot.
        tl: Kapag luto na ang baka, hanguin ang karne at ilipat sa isang malaking mangkok. Panatilihing mainit.
      - en: Strain the broth, then pour it back into the pot. Bring to a simmer.
        tl: Salain ang sabaw at ibalik sa kaserola. Pakuluan nang marahan.
      - en: >-
          Dissolve the starch in 2 tablespoons of water. Pour into the simmering broth. Cook,
          stirring, until thickened and clear.
        tl: >-
          Tunawin ang starch sa 2 kutsarang tubig. Ibuhos sa kumukulong sabaw. Lutuin habang
          hinahalo hanggang lumapot at luminaw.
      - en: Add the beef to the sauce and simmer for another 10 minutes.
        tl: Ibalik ang baka sa sarsa at pakuluan nang marahan nang 10 minuto pa.
      - en: >-
          To serve, fill a bowl with rice. Arrange several pieces of beef on top. Drizzle with a few
          tablespoons of sauce. Garnish with toasted garlic, fried onion slices and snipped
          scallions.
        tl: >-
          Sa paghahain, lagyan ng kanin ang isang mangkok. Iayos sa ibabaw ang ilang piraso ng
          baka. Buhusan ng ilang kutsarang sarsa. Palamutian ng tostadong bawang, piniritong
          sibuyas at hiniwang dahon ng sibuyas.
