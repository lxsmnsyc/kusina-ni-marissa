title: Pancit Malabon
summary:
  tl: >-
    Makapal na noodles sa sarsang may katas ng hipon at atsuete, may baboy, tokwa, tinapa at
    chicharon sa ibabaw.
  en: >-
    Thick rice noodles in a shrimp and annatto sauce with pork and tofu, topped with smoked fish,
    chicharon and egg.
category: kanin-at-pansit
tags: [noodles, pancit, shrimp, pork]
addedOn: "2026-10-13"

