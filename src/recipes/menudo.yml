title: Menudo
subtitle: { tl: Sariling bersyon, en: Own version }
summary:
  tl: Baboy at atay na niluto sa tomato sauce at liver spread, may patatas, carrots at pasas.
  en: Pork and liver stewed in tomato sauce and liver spread, with potatoes, carrots and raisins.
category: ulam
tags: [pork, liver, tomato]
addedOn: "2026-10-13"

