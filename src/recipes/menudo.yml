review:
  - No photo yet. The one sent in chat did not come through as a file.
  - The hotdog is listed ("1/4 hotdog", no unit) but no step uses it.
  - The potatoes and carrots have no preparation (cubed or sliced).
  - The quail eggs were only in the last step of the original. They were added to the ingredient list as optional.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: I-marinate ang baboy sa toyo, kalamansi at paminta nang mga 2 oras.
        en: Marinate the pork in soy sauce, calamansi and pepper for about 2 hours.
      - tl: Igisa ang sibuyas, bawang, kamatis at baboy, at palambutin.
        en: Sauté the onion, garlic, tomatoes and pork, and cook until the pork is tender.
      - tl: Pag malambot na, ilagay ang atay at bell pepper. Haluin at takpan.
        en: When tender, add the liver and bell pepper. Stir and cover.
      - tl: Pag kumulo na, ilagay ang patatas at carrots.
        en: Once it boils, add the potatoes and carrots.
      - tl: Then ilagay ang tomato sauce, Reno liver spread, pasas at pickles.
        en: Then add the tomato sauce, liver spread, raisins and pickles.
      - tl: Gadgaran ng keso.
        en: Grate cheese over it.
      - tl: Tikman at timplahan ayon sa panlasa.
        en: Taste and adjust the seasoning.
      - tl: Maaari ring dagdagan ng itlog ng pugo.
        en: You can also add quail eggs.
