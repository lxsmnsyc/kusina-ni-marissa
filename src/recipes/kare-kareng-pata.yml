title: Kare-Kare
subtitle: { tl: Pata ng baboy, en: Pork hock }
summary:
  tl: >-
    Pata ng baboy at gulay sa malapot na sarsang mani at dinikdik na bigas, inihahain kasama ng
    bagoong alamang.
  en: Pork hock and vegetables in a thick peanut and toasted rice sauce, served with shrimp paste.
category: ulam
tags: [pork, pata, peanut, vegetables]
addedOn: "2026-10-13"

ingredients:
  - items:
      - amount: 1
        item: { tl: pata ng baboy, en: pork hock }
      - amount: 5
        unit: { tl: kutsarita, en: tsp }
        item: { tl: mantika, en: cooking oil }
      - amount: 5
        unit: { tl: ulo, en: head }
        item: { tl: bawang, en: garlic }
        note: { tl: pinitpit, en: crushed }
      - amount: 1
        item: { tl: katamtamang laking sibuyas, en: medium onion }
        note: { tl: hiniwa-hiwa, en: sliced }
      - amount: 1/4
        unit: { tl: tasa, en: cup }
        item: { tl: katas ng achuete, en: annatto water }
      - amount: 1
        item: { tl: puso ng saging na saba, en: banana heart (saba) }
        note: { tl: hiniwa nang pahaba, en: cut lengthwise }
      - amount: 2
        unit: { tl: tali, en: bunch }
        item: { tl: sitaw, en: string beans }
        note: { tl: hiniwa nang tig-2 pulgada, en: cut into 2-inch lengths }
      - amount: 4
        item: { tl: katamtamang laking talong, en: medium eggplants }
        note: { tl: hiniwa nang tig-½ pulgada, en: cut into ½-inch slices }
      - amount: 1/2
        unit: { tl: tasa, en: cup }
        item: { tl: bigas, en: uncooked rice }
        note: { tl: tinusta at dinikdik nang pino, en: toasted and finely ground }
