review:
  - No photo yet. The one sent in chat did not come through as a file.
  - 5 ulo ng bawang (5 heads of garlic) is a lot. It may mean 5 butil (cloves).
  - Water is used to boil the pata and in steps 3 and 4 (¾ tasa), but it is not in the ingredient list.
  - The bagoong alamang was only in the last step of the original. It was added as its own ingredient group.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: Palambutin ang pata ng baboy. Hanguin mula sa tubig at prituhin nang bahagya sa mantika.
        en: Simmer the pork hock until tender. Remove from the water and lightly fry in oil.
      - tl: >-
          Igisa ang bawang at sibuyas sa mantika. Idagdag ang katas ng achuete. Igisa hanggang
          lumabas ang mantika ng pata ng baboy.
        en: >-
          Sauté the garlic and onion in the oil. Add the annatto water. Sauté until the fat from the
          pork hock renders.
      - tl: Idagdag ang gulay at kaunting tubig upang magkasarsa.
        en: Add the vegetables and a little water to make a sauce.
      - tl: >-
          Idagdag ang pinulbos na bigas at peanut butter na tinunaw sa ¾ tasang tubig. Timplahan ng
          asin, paminta at betsin.
        en: >-
          Add the ground toasted rice and the peanut butter dissolved in ¾ cup of water. Season with
          salt, pepper and MSG.
      - tl: Ihain nang may kasamang bagoong alamang.
        en: Serve with shrimp paste (bagoong alamang).
