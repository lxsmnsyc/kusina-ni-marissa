review:
  - The wording matches a widely shared online brownie recipe almost word for word, with peanuts added. The photo looks like Marissa's own. Check the text before publishing publicly.
  - The Tagalog translation was written during conversion.

steps:
  - steps:
      - en: Melt the butter or margarine and mix all the ingredients in the order given.
        tl: Tunawin ang butter o margarine at paghaluin ang lahat ng sangkap ayon sa pagkakasunod-sunod.
      - en: Pour into a greased 9 × 13 inch pan. Bake at 350°F for 20 to 30 minutes.
        tl: >-
          Ibuhos sa pinahiran ng mantikilyang 9 × 13 pulgadang pan. I-bake sa 350°F nang 20
          hanggang 30 minuto.
