title:
  tl: Morkon
  en: Morcon
subtitle: Murkon
summary:
  tl: >-
    Binilot na karne ng baka na may palamang giniling na baboy, hamon, itlog at chorizo, na niluto
    sa tomato sauce.
  en: Rolled beef stuffed with ground pork, ham, egg and chorizo, braised in tomato sauce.
category: ulam
image: photos/morkon.png
tags: [beef, chorizo, holiday]
addedOn: "2026-10-13"

