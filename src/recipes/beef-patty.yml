title: Beef Patty
summary:
  tl: Patties ng giniling na baka at hamon na inihurno sa cream of mushroom sauce.
  en: Ground beef and ham patties baked in a cream of mushroom sauce.
category: ulam
tags: [beef, ground beef, baked]
addedOn: "2026-10-13"

