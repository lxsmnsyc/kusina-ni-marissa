review:
  - No photo. The one supplied looked like a stock photo of raw patties, not the finished dish. Add Marissa's own photo.
  - The recipe ends before baking. It does not say how long to bake the patties.
  - Step 1 greases the pan with mantika, but it is not in the ingredient list.
  - The English translation was written during conversion.

steps:
  - steps:
      - tl: Painitin ang oven sa 350°F at pahiran ng mantika ang baking pan.
        en: Preheat the oven to 350°F and grease a baking pan with oil.
      - tl: Paghaluin ang unang 7 sangkap. Timplahan ng asin at paminta.
        en: Mix the first 7 ingredients. Season with salt and pepper.
      - tl: Idagdag ang ¼ tasa ng mushroom soup. Haluing mabuti.
        en: Add ¼ cup of the mushroom soup. Mix well.
      - tl: Ikorte ang patties at ilagay sa baking pan.
        en: Shape into patties and place in the baking pan.
      - tl: Idagdag ang tubig sa natirang soup at ibuhos sa ibabaw ng patties.
        en: Add the water to the remaining soup and pour it over the patties.
